name: Release Conda CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string
      upload:
        description: "Upload package to Anaconda.org"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  conda-publish:
    name: Publish release to Conda
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository and fetch tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          auto-update-conda: true
          activate-environment: false

      - name: Create Conda environment
        shell: bash
        run: |
          conda create -y -n dl1dh -c conda-forge \
            python=3.12 ctapipe conda-build anaconda-client

      - name: Build Conda package
        id: build
        shell: bash
        run: |
          CONDA_RECIPE_DIR=".github/conda"

          # Determine version
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FULL_TAG="${{ inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            FULL_TAG="${{ github.event.release.tag_name }}"
          else
            FULL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0+dev")
          fi

          VERSION="${FULL_TAG#v}"
          VERSION="${VERSION#V}"

          echo "Building package version: $VERSION"
          export PACKAGE_VERSION="$VERSION"

          # Determine output package path
          PACKAGE_PATH=$(conda run -n dl1dh \
            conda-build "$CONDA_RECIPE_DIR" --output)

          # Build
          conda run -n dl1dh \
            conda-build "$CONDA_RECIPE_DIR"

          # Verify package
          if [[ ! -f "$PACKAGE_PATH" ]]; then
            echo "ERROR: Package not found: $PACKAGE_PATH"
            exit 1
          fi

          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $PACKAGE_PATH"

      # Save the package BEFORE attempting the upload.
      - name: Archive Conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.sha }}
          path: ${{ steps.build.outputs.package_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload package to Anaconda
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' && inputs.upload
        shell: bash
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          ANACONDA_CHANNEL="ctlearn-project"

          conda run -n dl1dh anaconda upload \
            "${{ steps.build.outputs.package_path }}" \
            --force \
            --user "$ANACONDA_CHANNEL"
