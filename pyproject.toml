[build-system]
requires = ["setuptools >= 65", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dl1_data_handler"
description = "A package of utilities for reading, and applying image processing to Cherenkov Telescope Array (CTA) R1/DL0/DL1 data in a standardized format. Created primarily for testing machine learning image analysis techniques on IACT data."
readme = "README.rst"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Ari Brill"},
    {name = "Bryan Kim"},
    {name = "Tjark Miener"},
    {name = "Daniel Nieto", email = "d.nieto@ucm.es"}
]

classifiers = [
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

requires-python = ">=3.12"
dependencies = [
    "ctapipe~=0.33",
    "astropy",
    "eventio",
    "numpy",
    "pandas",
    "pip",
    "pyyaml",
    "scipy",
    "tables~=3.11",
    "traitlets",
    "pydot",
    "setuptools",
]

dynamic = ["version"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dl1_data_handler.resources" = ["*.h5"]

[project.optional-dependencies]
all = [
    "dl1_data_handler",
    "matplotlib ~=3.0",
]

tests = [
  "dl1_data_handler",
  "pytest",
  "pytest-xdist",
  "filelock",
]

docs = [
  "dl1_data_handler",
  "sphinx",
  "sphinx-rtd-theme",
]

dev = [
  "dl1_data_handler[all,docs,tests]",
  "codespell",
  "pre-commit",
  "ruff",
  "setuptools_scm[toml]",
]

[project.urls]
repository = "https://github.com/cta-observatory/dl1-data-handler"

[tool.setuptools_scm]
version_file = "src/dl1_data_handler/_version.py"

[tool.pytest.ini_options]
testpaths = ["src/dl1_data_handler"]

norecursedirs = [
    ".git",
    "notebooks",
    "build",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["dl1_data_handler"]

[tool.codespell]
ignore-words = ".codespell-ignores"
skip = "*.drawio,*.svg,*.egg-info/*"
ignore-regex = '"image/png":\s*"[^"]*"'
